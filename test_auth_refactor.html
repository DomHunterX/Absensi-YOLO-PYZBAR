<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Test Auth Refactor</title>
</head>
<body>
  <h1>Test Authentication Module</h1>
  <div id="result"></div>
  
  <script src="static/js/auth.js"></script>
  <script>
    const resultDiv = document.getElementById('result');
    
    // Test 1: Check if AuthModule is loaded
    if (typeof AuthModule !== 'undefined') {
      resultDiv.innerHTML += '<p>✅ AuthModule loaded successfully</p>';
      
      // Test 2: Check all methods exist
      const methods = ['getSessionToken', 'clearAuth', 'redirectToLogin', 'validateSession', 'requireAuth', 'apiFetch', 'logout'];
      let allMethodsExist = true;
      
      methods.forEach(method => {
        if (typeof AuthModule[method] === 'function') {
          resultDiv.innerHTML += `<p>✅ AuthModule.${method}() exists</p>`;
        } else {
          resultDiv.innerHTML += `<p>❌ AuthModule.${method}() NOT FOUND</p>`;
          allMethodsExist = false;
        }
      });
      
      if (allMethodsExist) {
        resultDiv.innerHTML += '<p><strong>✅ ALL TESTS PASSED!</strong></p>';
      }
      
      // Test 3: Test getSessionToken (should return null if no token)
      const token = AuthModule.getSessionToken();
      resultDiv.innerHTML += `<p>Token: ${token || 'null (expected)'}</p>`;
      
    } else {
      resultDiv.innerHTML += '<p>❌ AuthModule NOT loaded</p>';
    }
  </script>
</body>
</html>
